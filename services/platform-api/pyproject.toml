[project]
name = "alphadeck-platform-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.122,<1",
    "uvicorn>=0.30,<1",
    "websockets>=15,<17",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.3,<4",
    "python-dotenv>=1.2,<2",
    "python-multipart>=0.0.22,<1",
    "pyyaml>=6.0.3,<7",
    "cryptography>=46,<51",
    "argon2-cffi>=25,<26",
    "rfc8785>=0.1.4,<1",
    "jsonschema>=4.25,<5",
    "playwright>=1.51,<2",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-css>=0.25,<0.26",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
